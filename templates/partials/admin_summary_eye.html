<span class="summary-eye-tip">
  {% if material.has_ai_summary %}
    <button
      class="icon-btn icon-btn--summary icon-btn--summary-available"
      type="button"
      data-admin-summary="{{ material.id }}"
      aria-label="הצגת סיכום AI שנשמר עם הקובץ"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
    <span class="summary-eye-tip__bubble" role="tooltip">הצגת סיכום AI</span>
  {% else %}
    <span
      class="icon-btn icon-btn--summary icon-btn--summary-unavailable"
      tabindex="0"
      aria-label="אין סיכום AI"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </span>
    <span class="summary-eye-tip__bubble" role="tooltip">אין סיכום AI</span>
  {% endif %}
</span>
